[package]
name = "omnimd"
version = "0.2.2"
edition = "2021"
build = "build.rs"

[lib]
name = "omnid_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# In-app auto-update: checks the GitHub release `latest.json`, verifies the
# minisign signature, downloads and installs. `process` provides `relaunch()`.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Open preview links / external URLs in the system browser (webview cannot).
tauri-plugin-opener = "2"
# Local document-to-Markdown engine (pure Rust, no ML models).
anydoc = "0.2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
chrono = "0.4"
# SQLite bundled: compiles SQLite from source on every platform, ships FTS5
# out of the box (no system SQLite required on Windows).
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-subscriber = "0.3"

# Settings → 存储：按 DISK_CACHE 类型清除 WebView2 磁盘缓存。必须与 wry 依赖
# 的 webview2-com 保持同版本（Cargo.lock 锁定 0.38.2 / windows-core 0.61），
# 否则 COM 接口类型不一致，cast 会失败。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
