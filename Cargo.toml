[package]
name = "omnimd"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "omnid_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# In-app auto-update: checks the GitHub release `latest.json`, verifies the
# minisign signature, downloads and installs. `process` provides `relaunch()`.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Local document-to-Markdown engine (pure Rust, no ML models).
anydoc = "0.2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
chrono = "0.4"
# SQLite bundled: compiles SQLite from source on every platform, ships FTS5
# out of the box (no system SQLite required on Windows).
rusqlite = { version = "0.32", features = ["bundled"] }
tracing-subscriber = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
